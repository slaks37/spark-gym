name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_apk:
        description: "Also build a signed release APK + Play bundle (needs the keystore secrets)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The wrapper JAR is a binary in the repo, so confirm it is the real one
      # before handing it the build.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Build the variant that actually ships, on every push, so it cannot be
      # broken for the first time on release day. Unsigned here on purpose —
      # the signed artefact comes from the release job with the real key.
      #
      # Note that minification is currently OFF for release (see
      # app/build.gradle.kts), so this does not exercise R8 or proguard-rules.pro.
      # Turning minify on is a runtime risk that a build alone cannot clear, so
      # it needs testing on a device first.
      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      # Only produced when minification is enabled; kept so a crash report from
      # a shipped build can be de-obfuscated if that day comes.
      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore

      # The debug APK is signed with the standard debug key, so it installs on a
      # phone straight from the artifact — no keystore or Play account needed.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spark-gym-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  release:
    # Tagging v1.2.3 publishes that build as a downloadable release. The manual
    # switch produces the same signed APK without creating a tag, for handing
    # someone a build directly.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_apk
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # `secrets` cannot be read from an `if:` condition, so the keystore is
    # hoisted to the job environment where a step condition can see it.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # An unsigned APK cannot be installed, so say so now rather than
      # publishing a file that fails on the phone with "app not installed".
      - name: Require a signing key
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No signing key. A release APK must be signed or Android will refuse to install it."
            echo "::error::Create one and add KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD as repository secrets — see README, Install it."
            exit 1
          fi

      # Gradle signs the bundle itself; the keystore never lands in the repo.
      - name: Decode signing key
        run: |
          set -euo pipefail
          printenv KEYSTORE_BASE64 | base64 -d > "$RUNNER_TEMP/release.jks"

      # Play takes an App Bundle, not an APK. The APK is still built for
      # sideloading and direct distribution.
      - name: Build Play bundle and release APK
        env:
          SPARK_KEYSTORE: ${{ runner.temp }}/release.jks
          SPARK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SPARK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SPARK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Upload Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: spark-gym-play-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Gradle already signed it via signingConfigs; this only confirms the
      # certificate is really on the APK before anyone ships it.
      - name: Verify signature
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" app/build/outputs/apk/release/spark-gym-release.apk

      - name: Shred the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # Always downloadable from the run, tag or not.
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: spark-gym-release-apk
          path: app/build/outputs/apk/release/spark-gym-release.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            app/build/outputs/apk/release/spark-gym-release.apk
