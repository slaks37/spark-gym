name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The wrapper JAR is a binary in the repo, so confirm it is the real one
      # before handing it the build.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # The debug APK is signed with the standard debug key, so it installs on a
      # phone straight from the artifact — no keystore or Play account needed.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spark-gym-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  release:
    # Tagging v1.2.3 publishes that build as a downloadable release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # `secrets` cannot be read from an `if:` condition, so the keystore is
    # hoisted to the job environment where a step condition can see it.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      # Signing is opt-in: set the four secrets and the release APK is signed and
      # installable. Without them the job still publishes the unsigned APK, which
      # is useful for inspection but will not install until it is signed.
      - name: Sign APK
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          # Pick whichever build-tools the runner actually has rather than
          # pinning a version that may not be installed.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          printenv KEYSTORE_BASE64 | base64 -d > "$RUNNER_TEMP/release.jks"
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out app/build/outputs/apk/release/spark-gym-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            app/build/outputs/apk/release/*.apk
