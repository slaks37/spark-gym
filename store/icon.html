<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:512px;height:512px;overflow:hidden}
  .bg{width:512px;height:512px;
      background:radial-gradient(circle at 34% 26%, #16324f 0%, #0d1c30 46%, #070f1c 100%);
      display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="bg">
  <svg width="512" height="512" viewBox="0 0 108 108">
    <defs>
      <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#0EA5E9"/>
        <stop offset="100%" stop-color="#0369A1"/>
      </linearGradient>
      <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"  stop-color="#BAF3FF"/>
        <stop offset="55%" stop-color="#7CF5FF"/>
        <stop offset="100%" stop-color="#38BDF8"/>
      </linearGradient>
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="2.6" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g transform="translate(54 54) scale(0.86) translate(-54 -54)">
      <!-- shield -->
      <path d="M26,28 L54,18 L82,28 L82,64 L54,90 L26,64 Z"
            fill="#0B1524" stroke="url(#shield)" stroke-width="4.2"
            stroke-linejoin="round" filter="url(#glow)"/>
      <!-- inner bevel -->
      <path d="M31,31.5 L54,23.5 L77,31.5 L77,61.5 L54,83 L31,61.5 Z"
            fill="none" stroke="#0EA5E9" stroke-opacity="0.28" stroke-width="1.4"/>
      <!-- bolt -->
      <path d="M58,31 L39,60.5 L51.5,60.5 L47,79.5 L69,47.5 L56.5,47.5 Z"
            fill="url(#bolt)" filter="url(#glow)"/>
    </g>
  </svg>
</div></body></html>
