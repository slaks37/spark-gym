<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
  @font-face{font-family:x}
  html,body{margin:0;width:1024px;height:500px;overflow:hidden;
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{position:relative;width:1024px;height:500px;
    background:radial-gradient(120% 140% at 12% 18%, #17395c 0%, #0d1f36 45%, #060d18 100%);
    display:flex;align-items:center;overflow:hidden}
  .glowA{position:absolute;width:620px;height:620px;right:-140px;top:-190px;border-radius:50%;
    background:radial-gradient(circle,rgba(14,165,233,.32) 0%,rgba(14,165,233,0) 62%)}
  .glowB{position:absolute;width:520px;height:520px;left:-160px;bottom:-240px;border-radius:50%;
    background:radial-gradient(circle,rgba(139,92,246,.26) 0%,rgba(139,92,246,0) 65%)}
  .left{position:relative;padding:0 0 0 74px;z-index:2}
  h1{margin:0;font-size:70px;line-height:1.02;font-weight:800;color:#fff;letter-spacing:-2px}
  h1 span{color:#38BDF8}
  p{margin:20px 0 0;font-size:26px;color:#9FB6CC;font-weight:500;letter-spacing:.1px}
  .chips{margin-top:34px;display:flex;gap:11px}
  .chip{font-size:16px;font-weight:600;letter-spacing:.4px;padding:9px 17px;border-radius:999px;
    color:#CFE9FA;background:rgba(14,165,233,.13);border:1px solid rgba(56,189,248,.42)}
  .art{position:absolute;right:86px;top:50%;transform:translateY(-50%);z-index:2}
</style></head><body>
<div class="wrap">
  <div class="glowA"></div><div class="glowB"></div>
  <div class="left">
    <h1>SPARK <span>GYM</span></h1>
    <p>Train. Log. Watch the map light up.</p>
    <div class="chips">
      <div class="chip">MUSCLE HEAT MAP</div>
      <div class="chip">239 EXERCISES</div>
      <div class="chip">NUTRITION</div>
      <div class="chip">OFFLINE</div>
    </div>
  </div>
  <div class="art">
    <svg width="300" height="300" viewBox="0 0 108 108">
      <defs>
        <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0EA5E9"/><stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="b2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#BAF3FF"/><stop offset="55%" stop-color="#7CF5FF"/>
          <stop offset="100%" stop-color="#38BDF8"/>
        </linearGradient>
        <filter id="g2" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="2.4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <path d="M26,28 L54,18 L82,28 L82,64 L54,90 L26,64 Z"
            fill="rgba(8,20,34,.72)" stroke="url(#s2)" stroke-width="4.2"
            stroke-linejoin="round" filter="url(#g2)"/>
      <path d="M58,31 L39,60.5 L51.5,60.5 L47,79.5 L69,47.5 L56.5,47.5 Z"
            fill="url(#b2)" filter="url(#g2)"/>
    </svg>
  </div>
</div></body></html>
