<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Muscle Heatmap</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #090A0F; color: #fff; font-family: sans-serif; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; touch-action: none; }
    #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 14px; color: #38bdf8; letter-spacing: 1px; }
  </style>

  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="loading">LOADING 3D ANATOMY ENGINE...</div>
  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, controls;
    const muscleMeshes = {};
    let raycaster, mouse;

    const DEFAULT_COLORS = {
      cold: 0x38bdf8,
      low: 0x10b981,
      mid: 0xf59e0b,
      high: 0xef4444
    };

    function init() {
      const container = document.getElementById('canvas-container');

      // 1. Scene setup
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x090A0F);

      // 2. Camera setup
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.2, 4.5);

      // 3. Renderer setup
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // 4. Orbit Controls (360 Rotation & Pinch Zoom)
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 1.1, 0);
      controls.minDistance = 2.0;
      controls.maxDistance = 7.0;

      // 5. Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0x38bdf8, 1.2);
      dirLight1.position.set(5, 10, 7);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xa855f7, 0.8);
      dirLight2.position.set(-5, 5, -5);
      scene.add(dirLight2);

      const rimLight = new THREE.DirectionalLight(0xffffff, 0.5);
      rimLight.position.set(0, -5, -5);
      scene.add(rimLight);

      // 6. Raycaster for muscle tap detection
      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      build3DHumanAnatomy();

      const loadingEl = document.getElementById('loading');
      if (loadingEl) loadingEl.style.display = 'none';

      // Touch / Click event listeners
      window.addEventListener('resize', onWindowResize);
      renderer.domElement.addEventListener('pointerdown', onPointerDown);

      animate();
    }

    function build3DHumanAnatomy() {
      const bodyGroup = new THREE.Group();
      bodyGroup.name = "HumanBody";

      // Helper function to create muscle mesh
      function createMuscleMesh(name, geometry, position, rotation = [0,0,0], scale = [1,1,1]) {
        const material = new THREE.MeshStandardMaterial({
          color: DEFAULT_COLORS.cold,
          roughness: 0.4,
          metalness: 0.2,
          emissive: 0x000000,
          flatShading: false
        });

        const mesh = new THREE.Mesh(geometry, material);
        mesh.name = name;
        mesh.position.set(...position);
        mesh.rotation.set(...rotation);
        mesh.scale.set(...scale);
        mesh.castShadow = true;
        mesh.receiveShadow = true;

        bodyGroup.add(mesh);
        muscleMeshes[name] = mesh;
        return mesh;
      }

      // Base Head & Neck
      createMuscleMesh("HEAD", new THREE.SphereGeometry(0.22, 32, 32), [0, 2.1, 0], [0,0,0], [0.9, 1.1, 0.95]);
      createMuscleMesh("NECK", new THREE.CylinderGeometry(0.1, 0.12, 0.2, 16), [0, 1.88, 0]);

      // CHEST (Pectoralis Major Left & Right)
      createMuscleMesh("CHEST", new THREE.BoxGeometry(0.24, 0.2, 0.12), [0.15, 1.62, 0.12], [0, 0, -0.1]);
      createMuscleMesh("CHEST_R", new THREE.BoxGeometry(0.24, 0.2, 0.12), [-0.15, 1.62, 0.12], [0, 0, 0.1]);

      // SHOULDERS / DELTS (Front, Side, Rear)
      createMuscleMesh("FRONT_DELTS", new THREE.SphereGeometry(0.12, 16, 16), [0.32, 1.68, 0.08]);
      createMuscleMesh("FRONT_DELTS_R", new THREE.SphereGeometry(0.12, 16, 16), [-0.32, 1.68, 0.08]);
      createMuscleMesh("SIDE_DELTS", new THREE.SphereGeometry(0.13, 16, 16), [0.36, 1.68, 0.0]);
      createMuscleMesh("SIDE_DELTS_R", new THREE.SphereGeometry(0.13, 16, 16), [-0.36, 1.68, 0.0]);
      createMuscleMesh("REAR_DELTS", new THREE.SphereGeometry(0.12, 16, 16), [0.32, 1.68, -0.08]);
      createMuscleMesh("REAR_DELTS_R", new THREE.SphereGeometry(0.12, 16, 16), [-0.32, 1.68, -0.08]);

      // ARMS (Biceps, Triceps, Forearms)
      createMuscleMesh("BICEPS", new THREE.CylinderGeometry(0.08, 0.07, 0.28, 16), [0.38, 1.44, 0.04], [0, 0, -0.15]);
      createMuscleMesh("BICEPS_R", new THREE.CylinderGeometry(0.08, 0.07, 0.28, 16), [-0.38, 1.44, 0.04], [0, 0, 0.15]);
      createMuscleMesh("TRICEPS", new THREE.CylinderGeometry(0.085, 0.07, 0.3, 16), [0.38, 1.44, -0.06], [0, 0, -0.15]);
      createMuscleMesh("TRICEPS_R", new THREE.CylinderGeometry(0.085, 0.07, 0.3, 16), [-0.38, 1.44, -0.06], [0, 0, 0.15]);
      createMuscleMesh("FOREARMS", new THREE.CylinderGeometry(0.07, 0.05, 0.3, 16), [0.44, 1.12, 0.0], [0, 0, -0.2]);
      createMuscleMesh("FOREARMS_R", new THREE.CylinderGeometry(0.07, 0.05, 0.3, 16), [-0.44, 1.12, 0.0], [0, 0, 0.2]);

      // ABS & OBLIQUES
      createMuscleMesh("ABS", new THREE.BoxGeometry(0.24, 0.32, 0.14), [0, 1.38, 0.08]);
      createMuscleMesh("OBLIQUES", new THREE.BoxGeometry(0.1, 0.3, 0.14), [0.18, 1.36, 0.05], [0, 0, -0.1]);
      createMuscleMesh("OBLIQUES_R", new THREE.BoxGeometry(0.1, 0.3, 0.14), [-0.18, 1.36, 0.05], [0, 0, 0.1]);

      // BACK (Traps, Lats, Lower Back)
      createMuscleMesh("TRAPS", new THREE.ConeGeometry(0.28, 0.3, 4), [0, 1.76, -0.08], [Math.PI, 0, 0]);
      createMuscleMesh("LATS", new THREE.BoxGeometry(0.2, 0.34, 0.12), [0.18, 1.5, -0.1], [0, 0, 0.15]);
      createMuscleMesh("LATS_R", new THREE.BoxGeometry(0.2, 0.34, 0.12), [-0.18, 1.5, -0.1], [0, 0, -0.15]);
      createMuscleMesh("LOWER_BACK", new THREE.BoxGeometry(0.24, 0.22, 0.1), [0, 1.25, -0.08]);

      // LEGS (Glutes, Quads, Hamstrings, Calves)
      createMuscleMesh("GLUTES", new THREE.SphereGeometry(0.18, 16, 16), [0.14, 1.02, -0.08], [0,0,0], [1, 1.1, 0.9]);
      createMuscleMesh("GLUTES_R", new THREE.SphereGeometry(0.18, 16, 16), [-0.14, 1.02, -0.08], [0,0,0], [1, 1.1, 0.9]);
      createMuscleMesh("QUADS", new THREE.CylinderGeometry(0.13, 0.1, 0.45, 16), [0.16, 0.68, 0.06], [0.05, 0, -0.05]);
      createMuscleMesh("QUADS_R", new THREE.CylinderGeometry(0.13, 0.1, 0.45, 16), [-0.16, 0.68, 0.06], [0.05, 0, 0.05]);
      createMuscleMesh("HAMSTRINGS", new THREE.CylinderGeometry(0.12, 0.095, 0.45, 16), [0.16, 0.68, -0.06], [-0.05, 0, -0.05]);
      createMuscleMesh("HAMSTRINGS_R", new THREE.CylinderGeometry(0.12, 0.095, 0.45, 16), [-0.16, 0.68, -0.06], [-0.05, 0, 0.05]);
      createMuscleMesh("CALVES", new THREE.CylinderGeometry(0.095, 0.06, 0.38, 16), [0.16, 0.22, -0.04]);
      createMuscleMesh("CALVES_R", new THREE.CylinderGeometry(0.095, 0.06, 0.38, 16), [-0.16, 0.22, -0.04]);

      scene.add(bodyGroup);
    }

    let pointerDownTime = 0;
    function onPointerDown(e) {
      pointerDownTime = Date.now();
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      setTimeout(() => {
        if (Date.now() - pointerDownTime < 300) {
          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects(scene.children, true);
          if (intersects.length > 0) {
            let hitName = intersects[0].object.name;
            if (hitName.endsWith("_R")) hitName = hitName.substring(0, hitName.length - 2);
            if (window.AndroidBridge && window.AndroidBridge.onMuscleTapped) {
              window.AndroidBridge.onMuscleTapped(hitName);
            }
          }
        }
      }, 50);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.setAngle = function(degrees) {
      const rad = (degrees * Math.PI) / 180;
      const dist = 4.5;
      camera.position.x = dist * Math.sin(rad);
      camera.position.z = dist * Math.cos(rad);
      camera.position.y = 1.2;
      controls.update();
    };

    window.updateMuscleHeat = function(heatJson) {
      try {
        const data = JSON.parse(heatJson);
        for (const [muscle, intensity] of Object.entries(data)) {
          let hexColor = DEFAULT_COLORS.cold;
          if (intensity > 1.15) hexColor = DEFAULT_COLORS.high;
          else if (intensity > 0.7) hexColor = DEFAULT_COLORS.mid;
          else if (intensity > 0.25) hexColor = DEFAULT_COLORS.low;

          [muscle, muscle + "_R"].forEach(name => {
            if (muscleMeshes[name]) {
              muscleMeshes[name].material.color.setHex(hexColor);
              if (intensity > 0.25) {
                muscleMeshes[name].material.emissive.setHex(hexColor);
                muscleMeshes[name].material.emissiveIntensity = Math.min(0.5, intensity * 0.3);
              }
            }
          });
        }
      } catch (e) {
        console.error("Heat JSON error", e);
      }
    };

    window.onload = init;
  </script>
</body>
</html>
