<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Muscle Heatmap</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #090A0F; color: #fff; font-family: sans-serif; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; touch-action: none; }
    #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 14px; color: #38bdf8; letter-spacing: 1px; }
  </style>

  <!-- Three.js r128 + OrbitControls, bundled in the APK rather than fetched.
       A CDN would make the heat map — a core screen — blank on a phone with no
       signal, and would hand the user's IP to Cloudflare and jsDelivr on every
       open, which contradicts the offline-first, no-trackers promise. MIT. -->
  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
</head>
<body>
  <div id="loading">LOADING 3D ANATOMY ENGINE...</div>
  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, controls;
    const muscleMeshes = {};
    let raycaster, mouse;
    let pendingHeat = null;

    const DEFAULT_COLORS = {
      cold: 0x38bdf8,
      low: 0x10b981,
      mid: 0xf59e0b,
      high: 0xef4444
    };

    function init() {
      const container = document.getElementById('canvas-container');

      // 1. Scene setup
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x090A0F);

      // 2. Camera setup
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0.95, 2.6);

      // 3. Renderer setup
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // 4. Orbit Controls (360 Rotation & Pinch Zoom)
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 0.88, 0);
      controls.minDistance = 0.9;
      controls.maxDistance = 4.0;

      // 5. Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0x38bdf8, 1.2);
      dirLight1.position.set(5, 10, 7);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xa855f7, 0.8);
      dirLight2.position.set(-5, 5, -5);
      scene.add(dirLight2);

      const rimLight = new THREE.DirectionalLight(0xffffff, 0.5);
      rimLight.position.set(0, -5, -5);
      scene.add(rimLight);

      // 6. Raycaster for muscle tap detection
      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      build3DHumanAnatomy();

      // Touch / Click event listeners
      window.addEventListener('resize', onWindowResize);
      renderer.domElement.addEventListener('pointerdown', onPointerDown);
      renderer.domElement.addEventListener('pointerup', onPointerUp);

      animate();
    }

    // ---------------------------------------------------------------
    // Anatomy
    //
    // The body is a real anatomical mesh (Z-Anatomy, CC BY-SA 4.0) rather than
    // primitives: 19 nodes, each named for the Muscle enum value it represents,
    // so tinting and hit-testing both work by name with nothing to map.
    // See CREDITS.md.
    // ---------------------------------------------------------------

    function build3DHumanAnatomy() {
      const loader = new THREE.GLTFLoader();
      loader.load(
        'muscles.glb',
        (gltf) => {
          gltf.scene.traverse((o) => {
            if (!o.isMesh) return;
            o.material = new THREE.MeshStandardMaterial({
              color: DEFAULT_COLORS.cold,
              roughness: 0.55,
              metalness: 0.03,
              emissive: 0x000000,
              // Muscles that share a surface (rectus abdominis under the
              // obliques) otherwise speckle as the depth test flip-flops.
              polygonOffset: true,
              polygonOffsetFactor: 1,
              polygonOffsetUnits: 1
            });
            o.castShadow = true;
            o.receiveShadow = true;
            muscleMeshes[o.name] = o;
          });
          scene.add(gltf.scene);

          const el = document.getElementById('loading');
          if (el) el.style.display = 'none';
          window.__anatomyReady = true;
          // Whatever heat arrived while the mesh was still loading.
          if (pendingHeat) window.updateMuscleHeat(pendingHeat);
        },
        undefined,
        (err) => {
          console.error('anatomy load failed', err);
          const el = document.getElementById('loading');
          if (el) el.textContent = 'COULD NOT LOAD ANATOMY';
        }
      );
    }

    // Tap vs drag. The old check compared the press time against itself 50ms
    // later, so it was always true and every rotation of the model also fired a
    // muscle selection. Compare press to release, and require the finger to
    // have stayed roughly still.
    let downAt = 0, downX = 0, downY = 0;
    const TAP_MS = 350, TAP_SLOP = 12;

    function onPointerDown(e) {
      downAt = Date.now();
      downX = e.clientX;
      downY = e.clientY;
    }

    function onPointerUp(e) {
      const quick = Date.now() - downAt < TAP_MS;
      const still = Math.abs(e.clientX - downX) < TAP_SLOP &&
                    Math.abs(e.clientY - downY) < TAP_SLOP;
      if (!quick || !still) return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const hits = raycaster.intersectObjects(Object.values(muscleMeshes), false);
      const name = hits.length ? hits[0].object.name : null;
      if (window.AndroidBridge && window.AndroidBridge.onMuscleTapped) {
        // Tapping empty space clears the selection, so the control undoes itself.
        window.AndroidBridge.onMuscleTapped(name || "");
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.setAngle = function(degrees) {
      const rad = (degrees * Math.PI) / 180;
      const dist = 2.6;
      camera.position.x = dist * Math.sin(rad);
      camera.position.z = dist * Math.cos(rad);
      camera.position.y = 0.95;
      controls.target.set(0, 0.88, 0);
      controls.update();
    };

    window.updateMuscleHeat = function(heatJson) {
      pendingHeat = heatJson;
      try {
        const data = JSON.parse(heatJson);
        for (const [muscle, intensity] of Object.entries(data)) {
          let hexColor = DEFAULT_COLORS.cold;
          if (intensity > 1.15) hexColor = DEFAULT_COLORS.high;
          else if (intensity > 0.7) hexColor = DEFAULT_COLORS.mid;
          else if (intensity > 0.25) hexColor = DEFAULT_COLORS.low;

          [muscle, muscle + "_R"].forEach(name => {
            if (muscleMeshes[name]) {
              muscleMeshes[name].material.color.setHex(hexColor);
              if (intensity > 0.25) {
                muscleMeshes[name].material.emissive.setHex(hexColor);
                muscleMeshes[name].material.emissiveIntensity = Math.min(0.5, intensity * 0.3);
              } else {
                // Reset, or a muscle that cools down keeps yesterday's glow.
                muscleMeshes[name].material.emissive.setHex(0x000000);
                muscleMeshes[name].material.emissiveIntensity = 0;
              }
            }
          });
        }
      } catch (e) {
        console.error("Heat JSON error", e);
      }
    };

    window.onload = init;
  </script>
</body>
</html>
